name: Build, test and publish

on:
  push:
    branches: [main]
  pull_request:
  # Dispatch from main to publish the version in package.json; the job tags the commit afterwards.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jss-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: "2026.11.8"
          cache: true
          cache_save: ${{ github.event_name != 'pull_request' }}
          install_args: --locked
      - name: Install npm dependencies
        run: mise exec -- npm ci --ignore-scripts
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(mise exec -- node -p 'require("./node_modules/playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: mise exec -- npx playwright install chromium
      - name: Install Playwright Chromium system dependencies
        run: mise exec -- npx playwright install-deps chromium
      - name: Save Playwright Chromium cache
        if: github.event_name != 'pull_request' && steps.playwright-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Build, pack, and run all checks
        env:
          JSS_SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- bin/tests --out-dir artifacts
      - name: Build native benchmark harness
        run: mise exec -- bash scripts/build-benchmark-native.sh
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: artifacts/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    # npm's trusted publisher only accepts this environment, which only deploys from main.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: "2026.11.8"
          cache: true
          cache_save: false
          install_args: --locked node
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: artifacts
      - run: mise exec -- bin/publish --artifact artifacts/*.tgz
      - name: Tag the published commit
        run: |
          version=$(mise exec -- node -p 'require("./package.json").version')
          git tag "v$version" "$GITHUB_SHA"
          git push origin "v$version"
